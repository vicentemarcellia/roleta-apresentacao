<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta da Apresentação</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #fff8dc, #ffe4b5);
}

h1 {
    color: #ff6600;
}

.roleta-container {
    position: relative;
    width: 350px;
    height: 350px;
    margin: 20px auto;
}

.ponteiro {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 30px solid red;
    margin: 0 auto;
}

.roleta {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid #ff9933;
    transition: transform 4s ease-out;
    background: conic-gradient(
        #ff9999 0deg 60deg,
        #99ccff 60deg 120deg,
        #99ff99 120deg 180deg,
        #ffff99 180deg 240deg,
        #ffcc99 240deg 300deg,
        #cc99ff 300deg 360deg
    );
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background-color: #ff6600;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.resultado {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #cc3300;
    min-height: 40px;
}
</style>
</head>

<body>

<h1>🎡 Roleta da Apresentação 🎡</h1>

<div class="ponteiro"></div>

<div class="roleta-container">
    <div id="roleta" class="roleta"></div>
</div>

<button onclick="girar()">Girar 🎵</button>

<div class="resultado" id="resultado"></div>

<script>
const opcoes = [
    "💃 Apresente-se dançando",
    "🤗 Apresente-se abraçando um amigo",
    "🐶 Apresente-se imitando um animal",
    "🦘 Apresente-se pulando",
    "🤸 Apresente-se fazendo polichinelo",
    "❤️ Apresente-se fazendo um coração"
];

let anguloAtual = 0;

function girar() {
    const roleta = document.getElementById("roleta");
    const resultado = document.getElementById("resultado");

    resultado.innerText = "";

    const sorteio = Math.floor(Math.random() * 6);
    const anguloExtra = 360 * 5 + (sorteio * 60);
    anguloAtual += anguloExtra;

    roleta.style.transform = "rotate(" + anguloAtual + "deg)";

    setTimeout(() => {
        resultado.innerText = opcoes[sorteio];
    }, 4000);
}
</script>

</body>
</html>
