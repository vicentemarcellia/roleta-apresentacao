<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta da Apresentação</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #fff8dc, #ffe4b5);
}

h1 {
    color: #ff6600;
}

.roleta-container {
    position: relative;
    width: 420px;
    height: 420px;
    margin: 20px auto;
}

.ponteiro {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid red;
    z-index: 10;
}

.roleta {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #ff9933;
    position: relative;
    transition: transform 4s ease-out;
    background: conic-gradient(
        #ff9999 0deg 60deg,
        #99ccff 60deg 120deg,
        #99ff99 120deg 180deg,
        #ffff99 180deg 240deg,
        #ffcc99 240deg 300deg,
        #cc99ff 300deg 360deg
    );
}

.label {
    position: absolute;
    width: 120px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background-color: #ff6600;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.resultado {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #cc3300;
    min-height: 40px;
}

/* Confete */
.confete {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: cair 3s linear forwards;
}

@keyframes cair {
    to {
        transform: translateY(100vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<h1>🎡 Roleta da Apresentação 🎡</h1>

<div class="roleta-container">
    <div class="ponteiro"></div>

    <div id="roleta" class="roleta"></div>
</div>

<button onclick="girar()">Girar 🎉</button>

<div class="resultado" id="resultado"></div>

<script>
const opcoes = [
    "💃 Dançar",
    "🤗 Abraçar",
    "🐶 Animal",
    "🦘 Pular",
    "🤸 Polichinelo",
    "❤️ Coração"
];

const roleta = document.getElementById("roleta");

// Criar textos corretamente posicionados
for (let i = 0; i < 6; i++) {
    const label = document.createElement("div");
    label.className = "label";

    const angulo = i * 60 + 30; // centraliza no meio da fatia
    label.style.transform = `
        rotate(${angulo}deg)
        translate(140px)
        rotate(-${angulo}deg)
    `;

    label.innerText = opcoes[i];
    roleta.appendChild(label);
}

let anguloAtual = 0;

function girar() {
    const resultado = document.getElementById("resultado");
    resultado.innerText = "";

    const sorteio = Math.floor(Math.random() * 6);

    const anguloExtra = 360 * 5 + (360 - sorteio * 60 - 30);
    anguloAtual += anguloExtra;

    roleta.style.transform = "rotate(" + anguloAtual + "deg)";

    setTimeout(() => {
        resultado.innerText = "Apresente-se: " + opcoes[sorteio];
        soltarConfete();
    }, 4000);
}

function soltarConfete() {
    for (let i = 0; i < 60; i++) {
        const confete = document.createElement("div");
        confete.className = "confete";
        confete.style.left = Math.random() * 100 + "vw";
        confete.style.backgroundColor =
            ["#ff9999","#99ccff","#99ff99","#ffff99","#ffcc99","#cc99ff"]
            [Math.floor(Math.random() * 6)];
        document.body.appendChild(confete);
        setTimeout(() => confete.remove(), 3000);
    }
}
</script>

</body>
</html>
