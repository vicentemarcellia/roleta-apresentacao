<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta da Apresentação</title>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#e6e6e6;
}

h1{
    color:#ff6600;
}

.roleta-container{
    position:relative;
    width:450px;
    height:450px;
    margin:30px auto;
}

.ponteiro{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:35px solid #ff0000;
    z-index:10;
}

.roleta{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    transition:transform 4s cubic-bezier(.17,.67,.83,.67);
    background:conic-gradient(
        from -90deg,
        #ff5f5f 0deg 60deg,
        #ffd93d 60deg 120deg,
        #6bcB77 120deg 180deg,
        #4d96ff 180deg 240deg,
        #c77dff 240deg 300deg,
        #ff9f1c 300deg 360deg
    );
    box-shadow:
        inset 0 0 40px rgba(0,0,0,0.2),
        0 10px 20px rgba(0,0,0,0.3);
}

.borda{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    border:12px solid #00b4d8;
    box-sizing:border-box;
}

.centro{
    position:absolute;
    width:80px;
    height:80px;
    background:#ffcc00;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.label{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:0 0;
    width:160px;
    text-align:center;
    font-weight:bold;
    font-size:15px;
    color:#000;
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:18px;
    background:#ff6600;
    color:white;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

.resultado{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#cc3300;
    min-height:40px;
}
</style>
</head>

<body>

<h1>🎡 Roleta da Apresentação 🎡</h1>

<div class="roleta-container">
    <div class="ponteiro"></div>
    <div id="roleta" class="roleta">
        <div class="borda"></div>
        <div class="centro"></div>
    </div>
</div>

<button onclick="girar()">Girar 🎉</button>
<div class="resultado" id="resultado"></div>

<script>
const opcoes=[
"💃 Dançando",
"🤗 Abraço",
"🐶 Animal favorito",
"🦘 Pule seu nome",
"🤸 2 Polichinelos",
"❤️ Algo que ama"
];

const roleta=document.getElementById("roleta");
const total=opcoes.length;
const anguloFatia=360/total;
const raio=170;

// Texto diagonal acompanhando a fatia
for(let i=0;i<total;i++){

    const label=document.createElement("div");
    label.className="label";

    const angulo=i*anguloFatia + anguloFatia/2;

    label.style.transform=
    `rotate(${angulo}deg)
     translate(${raio}px)
     rotate(${angulo}deg)
     translate(-50%,-50%)`;

    label.innerText=opcoes[i];
    roleta.appendChild(label);
}

let anguloAtual=0;

function girar(){

    const resultado=document.getElementById("resultado");
    resultado.innerText="";

    const indice=Math.floor(Math.random()*total);

    const voltas=5*360;

    const anguloDestino=
        360 - (indice*anguloFatia + anguloFatia/2);

    anguloAtual+=voltas+anguloDestino;

    roleta.style.transform=`rotate(${anguloAtual}deg)`;

    setTimeout(()=>{
        resultado.innerText="🎉 Resultado: "+opcoes[indice];
    },4000);
}
</script>

</body>
</html>
