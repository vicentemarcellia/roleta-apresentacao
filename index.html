<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta da Apresentação</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #fff8dc, #ffe4b5);
}

h1 {
    color: #ff6600;
}

.roleta-container {
    position: relative;
    width: 420px;
    height: 420px;
    margin: 20px auto;
}

.ponteiro {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid red;
    z-index: 10;
}

.roleta {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #ff9933;
    position: relative;
    transition: transform 4s ease-out;
    transform: rotate(-90deg); /* 🔥 Alinha início no topo */
    background: conic-gradient(
        #ff9999 0deg 60deg,
        #99ccff 60deg 120deg,
        #99ff99 120deg 180deg,
        #ffff99 180deg 240deg,
        #ffcc99 240deg 300deg,
        #cc99ff 300deg 360deg
    );
}

.label {
    position: absolute;
    width: 140px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
    pointer-events: none;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background-color: #ff6600;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.resultado {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #cc3300;
    min-height: 40px;
}
</style>
</head>

<body>

<h1>🎡 Roleta da Apresentação 🎡</h1>

<div class="roleta-container">
    <div class="ponteiro"></div>
    <div id="roleta" class="roleta"></div>
</div>

<button onclick="girar()">Girar 🎉</button>

<div class="resultado" id="resultado"></div>

<script>
const opcoes = [
    "💃 Apresente-se dançando",
    "🤗 Cumprimente com abraço",
    "🐶 Fale seu animal favorito",
    "🦘 Pule dizendo seu nome",
    "🤸 Faça 2 polichinelos",
    "❤️ Diga algo que ama"
];

const roleta = document.getElementById("roleta");
const total = opcoes.length;
const anguloFatia = 360 / total;

// 🔥 Criar textos CENTRALIZADOS corretamente
for (let i = 0; i < total; i++) {

    const label = document.createElement("div");
    label.className = "label";

    const angulo = i * anguloFatia + anguloFatia / 2;

    label.style.transform =
        `rotate(${angulo}deg)
         translate(150px)
         rotate(90deg)
         translate(-50%, -50%)`;

    label.innerText = opcoes[i];
    roleta.appendChild(label);
}

let anguloAtual = -90; // começa alinhado com topo

function girar() {

    const resultado = document.getElementById("resultado");
    resultado.innerText = "";

    const giro = 360 * 5 + Math.random() * 360;

    anguloAtual += giro;

    roleta.style.transform = `rotate(${anguloAtual}deg)`;

    setTimeout(() => {

        const anguloNormalizado =
            ((anguloAtual % 360) + 360) % 360;

        const indice =
            Math.floor(anguloNormalizado / anguloFatia) % total;

        resultado.innerText =
            "🎉 Resultado: " + opcoes[indice];

    }, 4000);
}
</script>

</body>
</html>
